llms_about: |
  ## What HMXTECH Does
  HMXTECH Company Limited takes projects from concept to complete construction, within and beyond Tanzania's borders.

  1. **Consultancy (ERB No. 238L):** design and supervision of buildings, roads, water supply and sanitation, towers and steel structures, for public institutions, private institutions and individual clients.
  2. **Building construction (CRB B5/1393/07/2021):** residential houses, multistorey buildings, offices, apartments, factories, warehouses and godowns.
  3. **Civil works (CRB C6/2288/07/2021):** road construction and maintenance, water supply and sanitation, drainage and irrigation structures, bridges, culverts, towers, dams and tanks.
  4. **Analysis and design:** geotechnical investigation, soil testing and analysis, concrete mix design, structural integrity assessment and redesign, condition surveys, feasibility studies and water resources engineering.

  HMXTECH bids through open competitive tendering, selected tendering, design and build, the force account method and labour based technology. It also publishes the free Truss Analyzer web app (https://hmxtech.co.tz/truss/).
