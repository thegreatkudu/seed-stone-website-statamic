llms_about: |
  ## How Seedstone Works
  Seedstone is a Tanzania sourcing and trade-facilitation partner operating under the **Warehouse Receipt System (WRS)** regulated by the Tanzanian government. Goods move through licensed warehouses that issue warehouse receipts, and are traded through transparent auction-based bidding at the **Tanzania Mercantile Exchange (TMX)**.

  1. Sourcing from farmers and cooperatives (AMCOS).
  2. Quality preparation and grading to export standards.
  3. Storage in licensed WRS warehouses.
  4. Auction-based bidding at TMX.
  5. Clearing and forwarding.
  6. Godown-to-port logistics with order tracking.
  7. Export delivery to international buyers.

