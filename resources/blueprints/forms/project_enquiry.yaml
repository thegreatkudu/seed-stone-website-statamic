title: 'Project Enquiry'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: first_name
            field:
              type: text
              display: 'First Name'
              validate:
                - required
          -
            handle: last_name
            field:
              type: text
              display: 'Last Name'
              validate:
                - required
          -
            handle: email
            field:
              type: text
              display: Email
              input_type: email
              validate:
                - required
                - email
          -
            handle: phone
            field:
              type: text
              display: Phone
              input_type: tel
              validate:
                - nullable
                - 'max:30'
          -
            handle: project_type
            field:
              type: select
              display: 'Project Type'
              options:
                building: Building
                civil: 'Road or civil works'
                design: 'Consultancy or design only'
                supervision: 'Supervision only'
                testing: 'Materials testing'
                other: Other
              validate:
                - required
          -
            handle: location
            field:
              type: text
              display: 'Site Location'
              validate:
                - nullable
                - 'max:120'
          -
            handle: message
            field:
              type: textarea
              display: Message
              validate:
                - nullable
                - 'max:5000'
          -
            handle: newsletter
            field:
              type: text
              display: 'Wants News By Email'
