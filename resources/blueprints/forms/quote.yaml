title: 'Quote Request'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: item
            field:
              type: text
              display: 'Product / Service'
          -
            handle: name
            field:
              type: text
              display: 'Name'
              validate:
                - required
          -
            handle: email
            field:
              type: text
              display: 'Email Address'
              input_type: email
              validate:
                - required
                - email
          -
            handle: phone
            field:
              type: text
              display: 'Phone'
          -
            handle: date
            field:
              type: text
              display: 'Preferred Date'
          -
            handle: message
            field:
              type: textarea
              display: 'Message'
