title: Header
tabs:
  main:
    display: Main
    sections:
      -
        display: 'Price Ticker'
        instructions: 'Scrolling price bar at the very top of every page.'
        fields:
          -
            handle: price_ticker
            field:
              type: grid
              display: 'Ticker Items'
              mode: table
              add_row: 'Add Item'
              fields:
                -
                  handle: text
                  field:
                    type: text
                    display: Text
                    instructions: 'e.g. "Cashewnut $1,300 / tonne · Coffee $3,500 / tonne"'
                -
                  handle: url
                  field:
                    type: text
                    display: Link
      -
        display: 'Header Button'
        fields:
          -
            handle: cta_button_text
            field:
              type: text
              display: 'Button Text'
              width: 50
          -
            handle: cta_button_url
            field:
              type: text
              display: 'Button URL'
              width: 50
      -
        display: 'Advanced'
        fields:
          -
            handle: browser_warning
            field:
              type: text
              display: 'Old Browser Warning'
              instructions: 'Only shown to visitors on unsupported browsers.'
