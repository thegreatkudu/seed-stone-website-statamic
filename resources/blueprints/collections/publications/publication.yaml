title: Publication
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              required: true
              validate:
                - required
          -
            handle: topic
            field:
              type: select
              display: Topic
              instructions: 'Chooses the card illustration and the label above the title.'
              options:
                roads: Roads
                materials: Materials
                procurement: Procurement
                bridges: Bridges
                water: 'Water and sanitation'
              default: roads
              required: true
              validate:
                - required
          -
            handle: summary
            field:
              type: textarea
              display: Summary
              instructions: 'One or two plain sentences on what the paper found. Shown on the publications page.'
              required: true
              validate:
                - required
                - 'max:260'
          -
            handle: pdf_url
            field:
              type: text
              input_type: url
              display: 'PDF link'
              instructions: 'Full URL of the paper, e.g. https://software.hmxtech.co.tz/static/uploads/paper.pdf'
              required: true
              validate:
                - required
                - url
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
          -
            handle: featured
            field:
              type: toggle
              display: Featured
              instructions: 'Show this paper in the large feature at the top of the publications page. Only the first featured paper is used.'
          -
            handle: cover_image
            field:
              type: assets
              container: assets
              max_files: 1
              display: 'Feature image'
              instructions: 'Optional, used when the paper is featured. Without it the topic illustration is shown.'
          -
            handle: cover_alt
            field:
              type: text
              display: 'Feature image description'
              instructions: 'Describe the image for people who cannot see it.'
