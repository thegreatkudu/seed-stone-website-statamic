title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: nav_title
            field:
              type: text
              display: 'Navigation Title'
              instructions: 'Optionally override the title shown in the navigation menu.'
              placeholder: 'Defaults to the page title'
      -
        display: Builder
        fields:
          -
            import: page_builder
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
          -
            handle: banner_image
            field:
              container: assets
              folder: images/site
              max_files: 1
              type: assets
              display: 'Banner Image'
              instructions: 'Background of the page title banner. Leave empty to use the default from Globals → Settings.'
              listable: hidden
          -
            handle: show_title
            field:
              default: false
              type: toggle
              display: 'Show Title'
              icon: toggle
              instructions: 'Toggle this to show the Title of the page in the header.'
              listable: hidden
              instructions_position: above
              visibility: visible
              hide_display: false
