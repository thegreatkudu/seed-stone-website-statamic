title: 'Guide Page'
hide: true
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: nav_title
            field:
              type: text
              display: 'Navigation Title'
              instructions: 'Optionally override the title shown in the navigation menu.'
              placeholder: 'Defaults to the page title'
  hero:
    display: Hero
    sections:
      -
        display: 'Page Header'
        fields:
          -
            handle: hero_tag
            field:
              type: text
              display: 'Small Label'
              width: 50
          -
            handle: hero_heading
            field:
              type: text
              display: Headline
              width: 50
              validate:
                - required
          -
            handle: hero_text
            field:
              type: textarea
              display: 'Intro Text'
  body:
    display: Sections
    sections:
      -
        display: Sections
        fields:
          -
            handle: sections
            field:
              type: grid
              display: Sections
              instructions: 'One row per topic. Drag to reorder.'
              mode: stacked
              min_rows: 1
              add_row: 'Add section'
              reorderable: true
              listable: hidden
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Heading
                    validate:
                      - required
                -
                  handle: body
                  field:
                    type: bard
                    display: Text
                    buttons:
                      - bold
                      - italic
                      - anchor
                      - unorderedlist
                      - orderedlist
                    save_html: true
                    toolbar_mode: fixed
                    remove_empty_nodes: trim
                    validate:
                      - required
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
