title: 'Sign-In Page'
hide: true
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: nav_title
            field:
              type: text
              display: 'Navigation Title'
              instructions: 'Optionally override the title shown in the navigation menu.'
              placeholder: 'Defaults to the page title'
  intro:
    display: Intro
    sections:
      -
        display: Intro
        fields:
          -
            handle: back_label
            field:
              type: text
              display: 'Back Link Label'
              instructions: 'Top-right link to the home page.'
          -
            handle: intro_tag
            field:
              type: text
              display: 'Small Label'
              width: 50
          -
            handle: intro_heading
            field:
              type: text
              display: Headline
              width: 50
              validate:
                - required
          -
            handle: intro_text
            field:
              type: textarea
              display: Text
          -
            handle: notice
            field:
              type: bard
              display: Notice
              instructions: 'The highlighted note under the intro. Leave empty to hide.'
              buttons:
                - bold
                - italic
                - anchor
              save_html: true
              toolbar_mode: fixed
              remove_empty_nodes: trim
  form:
    display: Form
    sections:
      -
        display: Form
        fields:
          -
            handle: form_button
            field:
              type: text
              display: 'Button Label'
              width: 50
              validate:
                - required
          -
            handle: closed_message
            field:
              type: textarea
              display: 'Message While the Portal Is Closed'
              instructions: 'Shown when someone presses the button. The form fields themselves are fixed until the portal is connected.'
              validate:
                - required
          -
            handle: switch_text
            field:
              type: text
              display: 'Switch Question'
              width: 33
          -
            handle: switch_link_label
            field:
              type: text
              display: 'Switch Link Label'
              instructions: 'e.g. "Create an account".'
              width: 33
              validate:
                - required
          -
            handle: switch_url
            field:
              type: text
              display: 'Switch Link'
              width: 33
              validate:
                - required
      -
        display: 'Other Options'
        fields:
          -
            handle: alt_links
            field:
              type: grid
              display: 'Buttons Under "or"'
              instructions: 'Start with / for a page on this site or https:// for another site (opens in a new tab). Leave empty to hide the "or" divider.'
              mode: table
              min_rows: 0
              max_rows: 3
              add_row: 'Add button'
              reorderable: true
              listable: hidden
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Label
                    validate:
                      - required
                -
                  handle: url
                  field:
                    type: text
                    display: Link
                    validate:
                      - required
      -
        display: 'Footer Line'
        fields:
          -
            handle: foot_badges
            field:
              type: list
              display: Badges
              width: 50
          -
            handle: foot_note
            field:
              type: text
              display: Note
              width: 50
  art:
    display: 'Side Panel'
    sections:
      -
        display: 'Side Panel'
        instructions: 'The drawing itself is part of the design.'
        fields:
          -
            handle: art_caption
            field:
              type: text
              display: Caption
              width: 66
          -
            handle: art_caption_note
            field:
              type: text
              display: 'Caption Note'
              width: 33
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
