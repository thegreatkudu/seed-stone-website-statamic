title: 'Home Page'
hide: true
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: nav_title
            field:
              type: text
              display: 'Navigation Title'
              instructions: 'Optionally override the title shown in the navigation menu.'
              placeholder: 'Defaults to the page title'
  hero:
    display: 'Hero Slider'
    sections:
      -
        display: 'Slides'
        instructions: 'Full-width image slides at the top of the home page. Use landscape images of at least 2400 × 1350 px; the left side sits under a dark overlay, so keep the subject towards the right.'
        fields:
          -
            handle: hero_slides
            field:
              type: grid
              display: 'Slides'
              mode: stacked
              min_rows: 1
              max_rows: 6
              add_row: 'Add slide'
              reorderable: true
              listable: hidden
              fields:
                -
                  handle: image
                  field:
                    type: assets
                    display: 'Background Image'
                    container: assets
                    folder: hero
                    max_files: 1
                    mode: grid
                    validate:
                      - required
                -
                  handle: image_alt
                  field:
                    type: text
                    display: 'Image Description'
                    instructions: 'Describe the photo for screen readers. Leave empty if it is purely decorative.'
                -
                  handle: has_brand_wash
                  field:
                    type: toggle
                    display: 'Image has the brand colour wash'
                    instructions: 'Turn on for images that already carry the magenta to blue wash, so the slide is darkened less and the colour shows.'
                    default: false
                -
                  handle: tab_label
                  field:
                    type: text
                    display: 'Tab Label'
                    instructions: 'Short name shown on the slide tab, e.g. "Scheduling".'
                    character_limit: 24
                    width: 50
                    validate:
                      - required
                -
                  handle: eyebrow
                  field:
                    type: text
                    display: 'Eyebrow'
                    instructions: 'Small label above the headline.'
                    width: 50
                -
                  handle: heading
                  field:
                    type: text
                    display: 'Headline'
                    instructions: 'Shown in white.'
                    width: 50
                    validate:
                      - required
                -
                  handle: heading_muted
                  field:
                    type: text
                    display: 'Headline (Continued)'
                    instructions: 'Follows the headline in a softer tone.'
                    width: 50
                -
                  handle: text
                  field:
                    type: textarea
                    display: 'Supporting Text'
                    character_limit: 180
                -
                  handle: primary_label
                  field:
                    type: text
                    display: 'Primary Button Label'
                    width: 50
                -
                  handle: primary_url
                  field:
                    type: link
                    display: 'Primary Button Link'
                    width: 50
                -
                  handle: secondary_label
                  field:
                    type: text
                    display: 'Secondary Button Label'
                    width: 50
                -
                  handle: secondary_url
                  field:
                    type: link
                    display: 'Secondary Button Link'
                    width: 50
      -
        display: 'Behaviour'
        fields:
          -
            handle: hero_autoplay
            field:
              type: toggle
              display: 'Autoplay'
              instructions: 'Advance slides automatically. Visitors who prefer reduced motion always get manual slides.'
              default: true
              width: 50
          -
            handle: hero_interval
            field:
              type: integer
              display: 'Seconds Per Slide'
              default: 7
              width: 50
              validate:
                - 'min:4'
                - 'max:20'
  features:
    display: 'Features'
    sections:
      -
        display: 'Everything You Need'
        instructions: 'The three-card section shown right after the hero slider.'
        fields:
          -
            handle: features_tag
            field:
              type: text
              display: 'Tag'
              width: 50
          -
            handle: features_heading
            field:
              type: text
              display: 'Headline'
              width: 50
          -
            handle: features_heading_muted
            field:
              type: text
              display: 'Headline (Continued)'
              instructions: 'Follows the headline in a softer tone.'
              width: 50
          -
            handle: features_text
            field:
              type: textarea
              display: 'Intro Text'
              width: 50
          -
            handle: features_cards
            field:
              type: grid
              display: 'Cards'
              mode: stacked
              min_rows: 1
              max_rows: 6
              add_row: 'Add card'
              reorderable: true
              listable: hidden
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: 'Title'
                    width: 50
                    validate:
                      - required
                -
                  handle: text
                  field:
                    type: textarea
                    display: 'Text'
                    width: 50
                -
                  handle: image
                  field:
                    type: assets
                    display: 'Preview Image'
                    instructions: 'Optional. Without an image, the first three cards show built-in product previews.'
                    container: assets
                    folder: features
                    max_files: 1
                    mode: grid
                    width: 50
                -
                  handle: image_alt
                  field:
                    type: text
                    display: 'Image Description'
                    width: 50
  stages:
    display: 'Stages'
    sections:
      -
        display: 'One Team for Every Stage'
        instructions: 'The dark panel after "What we do". Visitors click through the five stages; the drawing beside them is fixed.'
        fields:
          -
            handle: stages_heading
            field:
              type: text
              display: 'Headline'
              validate:
                - required
          -
            handle: stages_text
            field:
              type: textarea
              display: 'Intro Text'
          -
            handle: stages
            field:
              type: grid
              display: 'Stages'
              instructions: 'Exactly five stages, in order. Each one matches a step of the drawing, so they cannot be added or removed.'
              mode: table
              min_rows: 5
              max_rows: 5
              reorderable: false
              listable: hidden
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: 'Stage Name'
                    character_limit: 20
                    width: 33
                    validate:
                      - required
                -
                  handle: text
                  field:
                    type: textarea
                    display: 'Description'
                    width: 66
                    validate:
                      - required
  projects:
    display: 'Projects'
    sections:
      -
        display: 'Built for Work That Stands'
        instructions: 'The "Projects" section (menu link #projects): three cards with fixed drawings, then the registrations strip.'
        fields:
          -
            handle: projects_heading
            field:
              type: text
              display: 'Headline'
              validate:
                - required
          -
            handle: projects_text
            field:
              type: textarea
              display: 'Intro Text'
          -
            handle: projects_link_label
            field:
              type: text
              display: 'Link Label'
              width: 50
          -
            handle: projects_link_url
            field:
              type: link
              display: 'Link'
              width: 50
          -
            handle: project_cards
            field:
              type: grid
              display: 'Cards'
              instructions: 'Exactly three cards, in order: buildings, structures, roads. Each card sits on its own fixed drawing.'
              mode: stacked
              min_rows: 3
              max_rows: 3
              reorderable: false
              listable: hidden
              fields:
                -
                  handle: tag
                  field:
                    type: text
                    display: 'Small Label'
                    width: 33
                    validate:
                      - required
                -
                  handle: title
                  field:
                    type: text
                    display: 'Title'
                    width: 66
                    validate:
                      - required
                -
                  handle: text
                  field:
                    type: text
                    display: 'Text'
      -
        display: 'Registrations Strip'
        instructions: 'The row of registrations under the cards. Five fit best on one line.'
        fields:
          -
            handle: registrations
            field:
              type: grid
              display: 'Registrations'
              mode: table
              min_rows: 1
              max_rows: 6
              add_row: 'Add registration'
              reorderable: true
              listable: hidden
              fields:
                -
                  handle: status
                  field:
                    type: text
                    display: 'Small Label'
                    instructions: 'e.g. "Consulting firm"'
                -
                  handle: label
                  field:
                    type: text
                    display: 'Name'
                    instructions: 'e.g. "ERB"'
                    validate:
                      - required
                -
                  handle: meta
                  field:
                    type: text
                    display: 'Detail'
                    instructions: 'e.g. "Registration No. 238L"'
  site_record:
    display: 'Site Record'
    sections:
      -
        display: 'Every Project, One Site Record'
        instructions: 'Text beside the site visit card. The card itself is a fixed illustration.'
        fields:
          -
            handle: record_tag
            field:
              type: text
              display: 'Small Label'
              width: 50
          -
            handle: record_heading
            field:
              type: text
              display: 'Headline'
              width: 50
              validate:
                - required
          -
            handle: record_text
            field:
              type: textarea
              display: 'Text'
          -
            handle: record_button_label
            field:
              type: text
              display: 'Button Label'
              instructions: 'Leave empty to hide the button.'
              width: 50
          -
            handle: record_button_url
            field:
              type: link
              display: 'Button Link'
              width: 50
  truss:
    display: 'Truss Analyzer'
    sections:
      -
        display: 'Truss Analyzer'
        instructions: 'Text beside the truss workbook drawing.'
        fields:
          -
            handle: truss_tag
            field:
              type: text
              display: 'Small Label'
              width: 50
          -
            handle: truss_heading
            field:
              type: text
              display: 'Headline'
              width: 50
              validate:
                - required
          -
            handle: truss_text
            field:
              type: textarea
              display: 'Text'
          -
            handle: truss_points
            field:
              type: grid
              display: 'Key Points'
              mode: table
              min_rows: 0
              max_rows: 4
              add_row: 'Add point'
              reorderable: true
              listable: hidden
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: 'Title'
                    validate:
                      - required
                -
                  handle: text
                  field:
                    type: text
                    display: 'Text'
          -
            handle: truss_button_label
            field:
              type: text
              display: 'Button Label'
              instructions: 'Leave empty to hide the button.'
              width: 50
          -
            handle: truss_button_url
            field:
              type: link
              display: 'Button Link'
              width: 50
          -
            handle: truss_note
            field:
              type: text
              display: 'Note Under the Button'
  lab:
    display: 'Lab'
    sections:
      -
        display: 'Tested in the Lab'
        instructions: 'The dark panel with the lab results drawing.'
        fields:
          -
            handle: lab_tag
            field:
              type: text
              display: 'Small Label'
              width: 50
          -
            handle: lab_topics
            field:
              type: list
              display: 'Topic Tags'
              instructions: 'Short highlighted tags, e.g. "Geotechnical". Two or three look best.'
              width: 50
          -
            handle: lab_heading
            field:
              type: text
              display: 'Headline'
              validate:
                - required
          -
            handle: lab_text
            field:
              type: textarea
              display: 'Text'
          -
            handle: lab_button_label
            field:
              type: text
              display: 'Button Label'
              width: 50
              validate:
                - required
          -
            handle: lab_button_url
            field:
              type: link
              display: 'Button Link'
              width: 50
  research:
    display: 'Research'
    sections:
      -
        display: 'Section Header'
        fields:
          -
            handle: research_tag
            field:
              type: text
              display: 'Small Label'
              width: 50
          -
            handle: research_heading
            field:
              type: text
              display: 'Headline'
              width: 50
              validate:
                - required
          -
            handle: research_text
            field:
              type: textarea
              display: 'Intro Text'
          -
            handle: research_link_label
            field:
              type: text
              display: 'Link Label'
              width: 50
          -
            handle: research_link_url
            field:
              type: link
              display: 'Link'
              width: 50
      -
        display: 'Featured Finding'
        instructions: 'The large quote, from one of our publications.'
        fields:
          -
            handle: research_quote
            field:
              type: textarea
              display: 'Finding'
              validate:
                - required
          -
            handle: research_quote_source
            field:
              type: text
              display: 'Publication Title'
          -
            handle: research_quote_initials
            field:
              type: text
              display: 'Initials Badge'
              instructions: 'Two letters shown in the round badge.'
              character_limit: 3
              width: 33
          -
            handle: research_quote_meta
            field:
              type: text
              display: 'Caption'
              instructions: 'e.g. "Featured publication · Road pavements"'
              width: 66
          -
            handle: research_metrics
            field:
              type: grid
              display: 'Figures'
              instructions: 'Two figures shown beside the quote.'
              mode: table
              min_rows: 2
              max_rows: 2
              reorderable: true
              listable: hidden
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: 'Label'
                -
                  handle: value
                  field:
                    type: text
                    display: 'Figure'
                    validate:
                      - required
                -
                  handle: text
                  field:
                    type: text
                    display: 'Detail'
      -
        display: 'Publication Cards'
        fields:
          -
            handle: research_papers
            field:
              type: grid
              display: 'Publications'
              instructions: 'Three cards fit one row.'
              mode: stacked
              min_rows: 0
              max_rows: 6
              add_row: 'Add publication'
              reorderable: true
              listable: hidden
              fields:
                -
                  handle: title
                  field:
                    type: textarea
                    display: 'Title'
                    validate:
                      - required
                -
                  handle: topic
                  field:
                    type: text
                    display: 'Topic'
                    width: 50
                -
                  handle: label
                  field:
                    type: text
                    display: 'Label'
                    instructions: 'e.g. "Publication"'
                    width: 50
  delivery:
    display: 'Delivery'
    sections:
      -
        display: 'How We Deliver'
        fields:
          -
            handle: delivery_tag
            field:
              type: text
              display: 'Small Label'
              width: 50
          -
            handle: delivery_heading
            field:
              type: text
              display: 'Headline'
              width: 50
              validate:
                - required
          -
            handle: delivery_text
            field:
              type: textarea
              display: 'Intro Text'
          -
            handle: delivery_tiers
            field:
              type: grid
              display: 'Columns'
              instructions: 'Exactly three columns, in order. The middle one is highlighted and can carry a badge.'
              mode: stacked
              min_rows: 3
              max_rows: 3
              reorderable: false
              listable: hidden
              fields:
                -
                  handle: name
                  field:
                    type: text
                    display: 'Name'
                    width: 50
                    validate:
                      - required
                -
                  handle: badge
                  field:
                    type: text
                    display: 'Badge'
                    instructions: 'Middle column only, e.g. "Concept to completion".'
                    width: 50
                -
                  handle: text
                  field:
                    type: text
                    display: 'Short Description'
                -
                  handle: amount
                  field:
                    type: text
                    display: 'Big Text'
                    instructions: 'e.g. "ERB"'
                    width: 33
                -
                  handle: unit
                  field:
                    type: text
                    display: 'Text Beside It'
                    instructions: 'e.g. "Registration No. 238L"'
                    width: 66
                -
                  handle: button_label
                  field:
                    type: text
                    display: 'Button Label'
                    width: 50
                    validate:
                      - required
                -
                  handle: button_url
                  field:
                    type: link
                    display: 'Button Link'
                    width: 50
                -
                  handle: items
                  field:
                    type: list
                    display: 'What Is Included'
                    instructions: 'One item per line, shown with a tick.'
          -
            handle: delivery_note
            field:
              type: text
              display: 'Note Under the Columns'
          -
            handle: delivery_note_link_label
            field:
              type: text
              display: 'Note Link Label'
              width: 50
          -
            handle: delivery_note_link_url
            field:
              type: link
              display: 'Note Link'
              width: 50
  faq:
    display: 'FAQ'
    sections:
      -
        display: 'Questions, Answered'
        fields:
          -
            handle: faq_tag
            field:
              type: text
              display: 'Small Label'
              width: 50
          -
            handle: faq_heading
            field:
              type: text
              display: 'Headline'
              width: 50
              validate:
                - required
          -
            handle: faq_text
            field:
              type: textarea
              display: 'Intro Text'
          -
            handle: faq_link_label
            field:
              type: text
              display: 'Link Label'
              width: 50
          -
            handle: faq_link_url
            field:
              type: link
              display: 'Link'
              width: 50
          -
            handle: faqs
            field:
              type: grid
              display: 'Questions'
              mode: stacked
              min_rows: 1
              add_row: 'Add question'
              reorderable: true
              listable: hidden
              fields:
                -
                  handle: question
                  field:
                    type: text
                    display: 'Question'
                    validate:
                      - required
                -
                  handle: answer
                  field:
                    type: textarea
                    display: 'Answer'
                    validate:
                      - required
  closing:
    display: 'Closing'
    sections:
      -
        display: 'Closing Call to Action'
        instructions: 'The last block on the page, above the footer.'
        fields:
          -
            handle: cta_heading
            field:
              type: text
              display: 'Headline'
              validate:
                - required
          -
            handle: cta_text
            field:
              type: textarea
              display: 'Text'
          -
            handle: cta_primary_label
            field:
              type: text
              display: 'Main Button Label'
              width: 50
              validate:
                - required
          -
            handle: cta_primary_url
            field:
              type: link
              display: 'Main Button Link'
              width: 50
          -
            handle: cta_secondary_label
            field:
              type: text
              display: 'Second Button Label'
              instructions: 'Leave empty to hide it.'
              width: 50
          -
            handle: cta_secondary_url
            field:
              type: link
              display: 'Second Button Link'
              instructions: 'For a phone number, type tel: then the number, e.g. tel:+255758526792'
              width: 50
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
