title: Article
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              validate:
                - required
          -
            handle: summary
            field:
              type: textarea
              display: Summary
              instructions: 'One or two sentences shown on the News page, under the title and in search results.'
              validate:
                - required
                - 'max:240'
          -
            handle: featured_image
            field:
              type: assets
              display: 'Cover Image'
              instructions: 'Optional. Shown at the top of the page and on the News card.'
              container: assets
              max_files: 1
              mode: grid
          -
            handle: image_alt
            field:
              type: text
              display: 'Cover Image Description'
              instructions: 'Describe the image for people who cannot see it.'
          -
            handle: content
            field:
              type: markdown
              display: Article
              instructions: 'Write in Markdown: ## for section headings, - for lists, **bold**, and [text](https://link) for links.'
              validate:
                - required
          -
            handle: pdf
            field:
              type: assets
              display: 'Paper (PDF)'
              instructions: 'Optional. The paper this article is based on; shows a download button. Pick it from the publications folder or upload a new PDF.'
              container: assets
              folder: files/publications
              restrict: true
              max_files: 1
              mode: list
      -
        display: 'Related Publications'
        fields:
          -
            handle: related_topic
            field:
              type: select
              display: Topic
              instructions: 'Shows three papers from this topic under the article.'
              options:
                roads: Roads
                materials: Materials
                procurement: Procurement
                bridges: Bridges
                water: 'Water and sanitation'
              default: roads
      -
        display: 'Closing Box'
        fields:
          -
            handle: cta_heading
            field:
              type: text
              display: Headline
              instructions: 'Optional. The box at the bottom of the article; leave empty to hide it.'
          -
            handle: cta_text
            field:
              type: textarea
              display: Text
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              display: Slug
              validate:
                - required
          -
            handle: date
            field:
              type: date
              display: Date
              instructions: 'Newest first on the News page.'
              validate:
                - required
          -
            handle: topic
            field:
              type: text
              display: Topic
              instructions: 'Shown above the title, e.g. Roads.'
          -
            handle: author_name
            field:
              type: text
              display: 'Author Name'
              default: 'HMXTECH Engineering'
          -
            handle: author_role
            field:
              type: text
              display: 'Author Role'
          -
            handle: author_bio
            field:
              type: textarea
              display: 'Author Bio'
          -
            handle: read_time
            field:
              type: integer
              display: 'Reading Time (minutes)'
