title: Article
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              required: true
              validate:
                - required
          -
            handle: summary
            field:
              type: textarea
              display: Summary
              instructions: 'One or two sentences shown under the title and in search results.'
              validate:
                - required
                - 'max:240'
          -
            handle: featured_image
            field:
              type: assets
              container: assets
              max_files: 1
              display: 'Cover image'
          -
            handle: image_alt
            field:
              type: text
              display: 'Cover image description'
              instructions: 'Describe the image for people who cannot see it.'
          -
            handle: content
            field:
              type: markdown
              display: Article
              instructions: 'Write in Markdown: ## for section headings, - for lists and > for a pull quote.'
              validate:
                - required
          -
            handle: related_topic
            field:
              type: select
              display: 'Related publications'
              instructions: 'Shows three papers from this topic under the article.'
              options:
                roads: Roads
                materials: Materials
                procurement: Procurement
                bridges: Bridges
                water: 'Water and sanitation'
              default: roads
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              validate:
                - required
          -
            handle: date
            field:
              type: date
              display: Date
              validate:
                - required
          -
            handle: topic
            field:
              type: text
              display: Topic
              instructions: 'Shown above the title, e.g. Roads.'
          -
            handle: author_name
            field:
              type: text
              display: 'Author name'
              default: 'HMXTECH Engineering'
          -
            handle: author_role
            field:
              type: text
              display: 'Author role'
          -
            handle: author_bio
            field:
              type: textarea
              display: 'Author bio'
          -
            handle: read_time
            field:
              type: integer
              display: 'Reading time (minutes)'
          -
            handle: pdf_url
            field:
              type: text
              input_type: url
              display: 'Paper link'
              instructions: 'Optional link to the full paper this article is based on.'
