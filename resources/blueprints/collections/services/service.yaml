tabs:
  main:
    display: Main
    sections:
      -
        display: Content
        fields:
          -
            import: global_page_title
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: featured_image
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Featured Image'
          -
            handle: card_image
            field:
              type: assets
              container: assets
              folder: images/site
              max_files: 1
              display: 'Card Image'
              instructions: 'Image on the Home and Our Services cards. Services without a card image are hidden from those grids.'
          -
            handle: excerpt
            field:
              type: textarea
              display: 'Short Description'
              instructions: 'A short description shown on the home services card.'
              width: 100
          -
            import: service_content
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            handle: service_type
            field:
              type: terms
              taxonomies:
                - service_type
              display: 'Service Type'
              mode: select
title: Service
