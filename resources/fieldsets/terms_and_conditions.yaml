title: 'Terms And Conditions'
fields:
  -
    handle: hero
    field:
      type: group
      display: 'Page Header'
      fields:
        -
          handle: title
          field:
            type: text
            display: 'Page Title'
        -
          handle: last_modified_label
          field:
            type: text
            display: 'Last Modified Label'
            width: 50
        -
          handle: last_modified
          field:
            format: 'F j, Y'
            type: date
            display: 'Last Modified Date'
            instructions: 'e.g. "November 15, 2023"'
            instructions_position: below
  -
    handle: sections
    field:
      type: replicator
      display: 'Content Sections'
      instructions: 'Each section appears as a nav item in the sidebar and a content block on the right.'
      instructions_position: below
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            content_section:
              display: 'Content Section'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: 'Section Title'
                -
                  handle: slug
                  field:
                    type: slug
                    display: 'Section Anchor ID'
                -
                  import: content
