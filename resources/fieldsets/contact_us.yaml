title: 'Contact Us'
fields:
  -
    handle: hero
    field:
      type: group
      display: 'Hero Section'
      instructions: 'Top banner heading of the page.'
      fields:
        -
          handle: title
          field:
            type: text
            display: Title
  -
    handle: talk_to_us
    field:
      type: group
      display: 'Talk to Us Section'
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: Eyebrow
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: paragraph
          field:
            type: textarea
            display: Paragraph
  -
    handle: form_labels
    field:
      type: group
      display: 'Contact Form'
      instructions: 'Submissions are saved under Forms → Contact and emailed to the address set on that form.'
      fields:
        -
          handle: name_label
          field:
            type: text
            display: 'Name Label'
        -
          handle: name_placeholder
          field:
            type: text
            display: 'Name Placeholder'
        -
          handle: email_label
          field:
            type: text
            display: 'Email Label'
        -
          handle: email_placeholder
          field:
            type: text
            display: 'Email Placeholder'
        -
          handle: phone_label
          field:
            type: text
            display: 'Phone Label'
        -
          handle: phone_placeholder
          field:
            type: text
            display: 'Phone Placeholder'
        -
          handle: subject_label
          field:
            type: text
            display: 'Subject Label'
        -
          handle: subject_placeholder
          field:
            type: text
            display: 'Subject Placeholder'
        -
          handle: message_label
          field:
            type: text
            display: 'Message Label'
        -
          handle: message_placeholder
          field:
            type: text
            display: 'Message Placeholder'
        -
          handle: submit_text
          field:
            type: text
            display: 'Submit Button Text'
        -
          handle: terms_text
          field:
            type: text
            display: 'Terms Note'
        -
          handle: success_message
          field:
            type: text
            display: 'Success Message'
            instructions: 'Shown after the form is sent.'
  -
    handle: get_in_touch
    field:
      type: group
      display: 'Get in Touch Section'
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: Eyebrow
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: paragraph
          field:
            type: textarea
            display: Paragraph
  -
    handle: map
    field:
      type: group
      display: 'Map Section'
      instructions: 'Use the Google Maps embed URL (Google Maps → Share → Embed a map → copy the iframe src). The place-based pb=… embed format shows the place popup with a Get directions button.'
      fields:
        -
          handle: embed_url
          field:
            type: text
            display: 'Google Maps Embed URL'
        -
          handle: title
          field:
            type: text
            display: 'Iframe Title'
        -
          handle: aria_label
          field:
            type: text
            display: 'Aria Label'
  -
    handle: contact_details
    field:
      type: group
      display: 'Contact Details'
      instructions: 'Displayed in the lime info card next to the map.'
      fields:
        -
          handle: address_label
          field:
            type: text
            display: 'Address Label'
        -
          handle: address
          field:
            type: text
            display: Address
        -
          handle: email_label
          field:
            type: text
            display: 'Email Label'
        -
          handle: email
          field:
            type: text
            display: 'Email Address'
        -
          handle: phone_label
          field:
            type: text
            display: 'Phone Label'
        -
          handle: phone
          field:
            type: text
            display: 'Phone Number'
  -
    handle: social
    field:
      type: group
      display: 'Social Links'
      instructions: 'Optional. Leave blank to hide a social icon.'
      fields:
        -
          handle: facebook_url
          field:
            type: text
            display: 'Facebook URL'
        -
          handle: twitter_url
          field:
            type: text
            display: 'X (Twitter) URL'
        -
          handle: tiktok_url
          field:
            type: text
            display: 'TikTok URL'
        -
          handle: youtube_url
          field:
            type: text
            display: 'YouTube URL'
        -
          handle: linkedin_url
          field:
            type: text
            display: 'LinkedIn URL'