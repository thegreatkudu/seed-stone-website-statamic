title: 'About Us Page'
fields:
  -
    handle: hero
    field:
      type: group
      display: 'Hero Section'
      instructions: 'Top banner of the page.'
      fields:
        -
          handle: title
          field:
            type: text
            display: Title
  -
    handle: who_we_are
    field:
      type: group
      display: 'Who We Are Section'
      instructions: 'Intro copy, a Contact Us button, an image, and exactly 4 stats counters.'
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: Eyebrow
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: paragraph
          field:
            type: textarea
            display: Paragraph
        -
          handle: button_text
          field:
            type: text
            display: 'Button Text'
        -
          handle: button_url
          field:
            type: text
            display: 'Button URL'
        -
          handle: image
          field:
            type: text
            display: 'Image URL'
            instructions: 'e.g. /seed-stone/wp-content/uploads/sites/11/2026/01/seedstone-about-crop-export.webp'
            instructions_position: below
        -
          handle: image_alt
          field:
            type: text
            display: 'Image Alt Text'
        -
          handle: stats
          field:
            type: grid
            display: 'Stats Counters'
            instructions: 'Exactly 4 counters are displayed.'
            fields:
              -
                handle: number
                field:
                  type: text
                  display: Number
              -
                handle: suffix
                field:
                  type: text
                  display: Suffix
              -
                handle: title
                field:
                  type: text
                  display: Title
  -
    handle: about
    field:
      type: group
      display: 'About Seedstone Section'
      instructions: 'Intro copy plus exactly 4 feature cards (image + title + description).'
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: Eyebrow
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: paragraph
          field:
            type: textarea
            display: Paragraph
        -
          handle: cards
          field:
            type: grid
            display: 'Feature Cards'
            instructions: 'Exactly 4 cards are displayed.'
            fields:
              -
                handle: image
                field:
                  type: text
                  display: 'Image URL'
                  instructions: 'e.g. /seed-stone/wp-content/uploads/sites/11/2026/01/seedstone-direct-sourcing.webp'
                  instructions_position: below
              -
                handle: title
                field:
                  type: text
                  display: Title
              -
                handle: description
                field:
                  type: textarea
                  display: Description
  -
    handle: why
    field:
      type: group
      display: 'Why Seedstone Section'
      instructions: 'Intro copy, an image, exactly 5 accordion items, and a second image.'
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: Eyebrow
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: paragraph
          field:
            type: textarea
            display: Paragraph
        -
          handle: image
          field:
            type: text
            display: 'Image URL'
            instructions: 'e.g. /seed-stone/wp-content/uploads/sites/11/2026/01/seedstone-values-sourcing.webp'
            instructions_position: below
        -
          handle: image_alt
          field:
            type: text
            display: 'Image Alt Text'
        -
          handle: accordion
          field:
            type: grid
            display: 'Accordion Items'
            instructions: 'Exactly 5 accordion items are displayed.'
            fields:
              -
                handle: title
                field:
                  type: text
                  display: Title
              -
                handle: text
                field:
                  type: textarea
                  display: Text
        -
          handle: secondary_image
          field:
            type: text
            display: 'Secondary Image URL'
            instructions: 'e.g. /seed-stone/wp-content/uploads/sites/11/2026/01/seedstone-clearing-forwarding.webp'
            instructions_position: below
        -
          handle: secondary_image_alt
          field:
            type: text
            display: 'Secondary Image Alt Text'