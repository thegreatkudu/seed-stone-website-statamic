title: 'Home Page'
fields:
  -
    handle: hero
    field:
      type: group
      display: 'Hero Section'
      fullscreen: false
      fields:
        -
          handle: watermark
          field:
            type: text
            display: 'Background Watermark Text'
            instructions: 'Large faded word behind the hero, e.g. "Seedstone".'
        -
          handle: rating_text
          field:
            type: text
            display: 'Rating Text'
            instructions: 'Small line with a star icon above the heading.'
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: text
          field:
            type: textarea
            display: 'Intro Text'
        -
          handle: button_1_text
          field:
            type: text
            display: 'Primary Button Text'
            width: 50
        -
          handle: button_1_url
          field:
            type: text
            display: 'Primary Button URL'
            width: 50
        -
          handle: button_2_text
          field:
            type: text
            display: 'Secondary Button Text'
            width: 50
        -
          handle: button_2_url
          field:
            type: text
            display: 'Secondary Button URL'
            width: 50
        -
          handle: image
          field:
            type: assets
            display: 'Hero Image'
            container: assets
            folder: images/site
            max_files: 1
  -
    handle: logos
    field:
      type: grid
      display: 'Partner Logo Strip'
      instructions: 'Logos scrolling under the hero.'
      mode: table
      add_row: 'Add Logo'
      fields:
        -
          handle: name
          field:
            type: text
            display: 'Organisation Name'
        -
          handle: logo
          field:
            type: assets
            display: Logo
            container: assets
            folder: images/site
            max_files: 1
  -
    handle: about
    field:
      type: group
      display: 'About Section'
      fullscreen: false
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: 'Small Label'
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: text
          field:
            type: textarea
            display: Text
        -
          handle: button_text
          field:
            type: text
            display: 'Button Text'
            width: 50
        -
          handle: button_url
          field:
            type: text
            display: 'Button URL'
            width: 50
        -
          handle: image
          field:
            type: assets
            display: Image
            container: assets
            folder: images/site
            max_files: 1
        -
          handle: stats
          field:
            type: grid
            display: 'Counters'
            mode: table
            max_rows: 4
            add_row: 'Add Counter'
            fields:
              -
                handle: number
                field:
                  type: integer
                  display: Number
              -
                handle: suffix
                field:
                  type: text
                  display: Suffix
                  instructions: 'e.g. "/7", "%", "x"'
              -
                handle: label
                field:
                  type: text
                  display: Label
  -
    handle: services
    field:
      type: group
      display: 'Services Section'
      instructions: 'The service cards come from the Services collection (entries with a card image).'
      fullscreen: false
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: 'Small Label'
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: text
          field:
            type: textarea
            display: Text
        -
          handle: card_button_text
          field:
            type: text
            display: 'Card Button Text'
  -
    handle: why_choose
    field:
      type: group
      display: 'Why Choose Us Section'
      fullscreen: false
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: 'Small Label'
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: text
          field:
            type: textarea
            display: Text
        -
          handle: items
          field:
            type: grid
            display: Reasons
            instructions: 'Up to 5 reasons. Icons are fixed per position.'
            max_rows: 5
            add_row: 'Add Reason'
            fields:
              -
                handle: title
                field:
                  type: text
                  display: Title
              -
                handle: text
                field:
                  type: textarea
                  display: Text
              -
                handle: url
                field:
                  type: text
                  display: 'Arrow Link URL'
        -
          handle: button_text
          field:
            type: text
            display: 'Button Text'
            width: 50
        -
          handle: button_url
          field:
            type: text
            display: 'Button URL'
            width: 50
  -
    handle: crops
    field:
      type: group
      display: 'Crops Section'
      fullscreen: false
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: 'Small Label'
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: text
          field:
            type: textarea
            display: Text
        -
          handle: button_text
          field:
            type: text
            display: 'Button Text'
            width: 50
        -
          handle: button_url
          field:
            type: text
            display: 'Button URL'
            width: 50
        -
          handle: items
          field:
            type: grid
            display: 'Crop Cards'
            max_rows: 4
            add_row: 'Add Crop'
            fields:
              -
                handle: label
                field:
                  type: text
                  display: 'Badge Label'
              -
                handle: title
                field:
                  type: text
                  display: Title
              -
                handle: description
                field:
                  type: textarea
                  display: Description
              -
                handle: url
                field:
                  type: text
                  display: 'Link URL'
              -
                handle: image
                field:
                  type: assets
                  display: 'Background Image'
                  container: assets
                  folder: images/site
                  max_files: 1
  -
    handle: testimonials
    field:
      type: group
      display: 'Testimonials Section'
      fullscreen: false
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: 'Small Label'
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: text
          field:
            type: textarea
            display: Text
        -
          handle: items
          field:
            type: grid
            display: Testimonials
            instructions: 'Four cards. Cards 1 and 4 show a quote icon, photo and button; cards 2 and 3 show a background image with a video button.'
            max_rows: 4
            add_row: 'Add Testimonial'
            fields:
              -
                handle: quote
                field:
                  type: textarea
                  display: Quote
              -
                handle: name
                field:
                  type: text
                  display: 'Name / Role'
                  width: 50
              -
                handle: location
                field:
                  type: text
                  display: Location
                  width: 50
              -
                handle: avatar
                field:
                  type: assets
                  display: 'Photo (cards 1 & 4)'
                  container: assets
                  folder: images/site
                  max_files: 1
              -
                handle: background_image
                field:
                  type: assets
                  display: 'Background Image (cards 2 & 3)'
                  container: assets
                  folder: images/site
                  max_files: 1
              -
                handle: video_url
                field:
                  type: text
                  display: 'Video URL (cards 2 & 3)'
                  instructions: 'YouTube embed URL opened by the play button.'
              -
                handle: button_text
                field:
                  type: text
                  display: 'Button Text (cards 1 & 4)'
                  width: 50
              -
                handle: button_url
                field:
                  type: text
                  display: 'Button URL (cards 1 & 4)'
                  width: 50
  -
    handle: highlights
    field:
      type: grid
      display: 'Highlight Counters'
      instructions: 'The three big numbers in the green band.'
      mode: table
      max_rows: 3
      add_row: 'Add Counter'
      fields:
        -
          handle: number
          field:
            type: integer
            display: Number
        -
          handle: suffix
          field:
            type: text
            display: Suffix
        -
          handle: label
          field:
            type: text
            display: Label
  -
    handle: work_with_us
    field:
      type: group
      display: 'Work With Us Box'
      fullscreen: false
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: 'Small Label'
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: list_label
          field:
            type: text
            display: 'List Label'
        -
          handle: benefits_left
          field:
            type: list
            display: 'Benefits (left column)'
            width: 50
        -
          handle: benefits_right
          field:
            type: list
            display: 'Benefits (right column)'
            width: 50
        -
          handle: button_text
          field:
            type: text
            display: 'Button Text'
            width: 50
        -
          handle: button_url
          field:
            type: text
            display: 'Button URL'
            width: 50
        -
          handle: image
          field:
            type: assets
            display: 'Decorative Image'
            container: assets
            folder: images/site
            max_files: 1
  -
    handle: newsletter
    field:
      type: group
      display: 'Newsletter Box'
      fullscreen: false
      fields:
        -
          handle: eyebrow
          field:
            type: text
            display: 'Small Label'
        -
          handle: heading
          field:
            type: text
            display: Heading
        -
          handle: text
          field:
            type: textarea
            display: Text
        -
          handle: button_text
          field:
            type: text
            display: 'Button Text'
            width: 50
        -
          handle: button_url
          field:
            type: text
            display: 'Button URL'
            width: 50
