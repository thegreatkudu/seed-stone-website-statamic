title: 'Newsletter Panel'
fields:
  -
    handle: tag
    field:
      type: text
      display: 'Small Label'
      width: 50
  -
    handle: heading
    field:
      type: text
      display: Headline
      width: 50
      validate:
        - required
  -
    handle: text
    field:
      type: textarea
      display: Text
  -
    handle: button
    field:
      type: text
      display: 'Button Label'
      width: 33
      validate:
        - required
  -
    handle: success
    field:
      type: text
      display: 'Thank-You Message'
      instructions: 'Shown after someone subscribes.'
      width: 66
      validate:
        - required
  -
    handle: error
    field:
      type: text
      display: 'Error Message'
      instructions: 'Shown when the sign-up could not be sent.'
      validate:
        - required
