title: 'Services Index'
fields:
  -
    import: global_page_title
  -
    handle: nav_items
    field:
      type: replicator
      display: 'Sticky Nav Items'
      sets:
        new_set_group:
          display: 'Nav Item'
          sets:
            nav_item:
              display: 'Nav Item'
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Label
                -
                  handle: slug
                  field:
                    type: slug
                    display: 'Anchor ID'
                -
                  handle: icon
                  field:
                    type: text
                    display: 'Icon Class'
                    instructions: 'e.g. icon icon-users'
                -
                  handle: badge
                  field:
                    type: text
                    display: 'Badge Text'
                    instructions: 'Optional badge e.g. PRO'
  -
    handle: sections
    field:
      type: replicator
      display: 'Feature Sections'
      sets:
        new_set_group:
          display: 'Section'
          sets:
            feature_section:
              display: 'Feature Section'
              fields:
                -
                  handle: slug
                  field:
                    type: slug
                    display: 'Anchor ID'
                    instructions: 'e.g. section1'
                -
                  handle: subtitle
                  field:
                    type: text
                    display: Subtitle
                -
                  handle: heading_prefix
                  field:
                    type: text
                    display: 'Heading Prefix'
                -
                  handle: heading_colored
                  field:
                    type: text
                    display: 'Heading Colored Text'
                -
                  handle: heading_suffix
                  field:
                    type: text
                    display: 'Heading Suffix'
                -
                  handle: description
                  field:
                    type: textarea
                    display: Description
                -
                  handle: features
                  field:
                    type: replicator
                    display: 'Feature List Items'
                    sets:
                      new_set_group:
                        display: 'Feature'
                        sets:
                          feature:
                            display: Feature
                            fields:
                              -
                                handle: label
                                field:
                                  type: text
                                  display: Label
                -
                  handle: image
                  field:
                    type: assets
                    container: assets
                    max_files: 1
                    display: Image
  -
    handle: feature_cards_section
    field:
      type: group
      display: 'Feature Cards Section'
      fields:
        -
          handle: subtitle
          field:
            type: text
            display: Subtitle
        -
          handle: heading_prefix
          field:
            type: text
            display: 'Heading Prefix'
        -
          handle: heading_colored
          field:
            type: text
            display: 'Heading Colored Text'
        -
          handle: heading_suffix
          field:
            type: text
            display: 'Heading Suffix'
        -
          handle: description
          field:
            type: textarea
            display: Description
        -
          handle: cards
          field:
            type: replicator
            display: Cards
            sets:
              new_set_group:
                display: Card
                sets:
                  card:
                    display: Card
                    fields:
                      -
                        handle: icon
                        field:
                          type: text
                          display: 'Icon Class'
                          instructions: 'e.g. icon icon-calendar2'
                      -
                        handle: title
                        field:
                          type: text
                          display: Title
                      -
                        handle: description
                        field:
                          type: textarea
                          display: Description
                      -
                        handle: link
                        field:
                          type: text
                          display: 'Link URL'
  -
    handle: cta_section
    field:
      type: group
      display: 'CTA Section'
      fields:
        -
          handle: subtitle
          field:
            type: text
            display: Subtitle
        -
          handle: heading_prefix
          field:
            type: text
            display: 'Heading Prefix'
        -
          handle: heading_colored
          field:
            type: text
            display: 'Heading Colored Text'
        -
          handle: heading_suffix
          field:
            type: text
            display: 'Heading Suffix'
        -
          handle: primary_button_label
          field:
            type: text
            display: 'Primary Button Label'
        -
          handle: primary_button_url
          field:
            type: text
            display: 'Primary Button URL'
        -
          handle: secondary_button_label
          field:
            type: text
            display: 'Secondary Button Label'
        -
          handle: secondary_button_url
          field:
            type: text
            display: 'Secondary Button URL'
